<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Assignment 9</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" 
    rel="stylesheet"
  >
  <style>
    .product-img {
      height: 300px;
      object-fit: contain;
      display: block;
      margin: 0 auto 1rem;
    }
    #orderMessage {
      text-align: center;
      font-weight: bold;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <nav class="navbar bg-light">
    <div class="container">
      <ul class="nav nav-pills mx-auto">
        <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Products</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
      </ul>
    </div>
  </nav>

  <div class="container my-5">
    <div class="row justify-content-center g-4">
      <div class="col-sm-6 col-md-4 text-center">
        <img src="images/xbox.jpg" alt="Xbox Series X" class="img-fluid product-img" data-bs-toggle="modal" data-bs-target="#xboxModal">
        <h5>Xbox Series X</h5>
      </div>
      <div class="col-sm-6 col-md-4 text-center">
        <img src="images/ps5.jpg" alt="PS5 Pro" class="img-fluid product-img" data-bs-toggle="modal" data-bs-target="#ps5Modal">
        <h5>PS5 Pro</h5>
      </div>
      <div class="col-sm-6 col-md-4 text-center">
        <img src="images/switch.jpg" alt="Nintendo Switch OLED" class="img-fluid product-img" data-bs-toggle="modal" data-bs-target="#switchModal">
        <h5>Nintendo Switch OLED</h5>
      </div>
    </div>
    <div id="orderMessage"></div>
  </div>

  <div class="modal fade" id="xboxModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Xbox Series X</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body text-center">
          <img src="images/xbox.jpg" class="img-fluid mb-2" alt="">
          <p>Power meets sleek design.</p>
        </div>
        <div class="modal-footer">
          <button class="btn btn-primary orderBtn">Add to Bag</button>
          <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="ps5Modal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">PS5 Pro</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body text-center">
          <img src="images/ps5.jpg" class="img-fluid mb-2" alt="">
          <p>Next-gen speed and immersion.</p>
        </div>
        <div class="modal-footer">
          <button class="btn btn-primary orderBtn">Add to Bag</button>
          <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="switchModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Nintendo Switch OLED</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body text-center">
          <img src="images/switch.jpg" class="img-fluid mb-2" alt="">
          <p>Vibrant OLED display with crisp contrast.</p>
        </div>
        <div class="modal-footer">
          <button class="btn btn-primary orderBtn">Add to Bag</button>
          <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <script 
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
  ></script>
  <script>
    window.onload = function() {
      var btns = document.getElementsByClassName('orderBtn');
      var msg  = document.getElementById('orderMessage');
      for (var i = 0; i < btns.length; i++) {
        btns[i].onclick = function() {
          var count = prompt('How many orders would you like to add to shopping cart?');
          if (count) {
            msg.innerText = 'Thank you! ' + count + ' orders are received!';
          }
        };
      }
    };
  </script>
</body>
</html>
