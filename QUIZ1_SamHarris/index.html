<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quiz 1 Slideshow</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>

  <div class="slideshow-container">
    <div class="slider">
      
      <!-- Slide 1: Picture + Paragraph -->
      <div class="slide">
        <img src="images/picture1.jpg" alt="Picture 1" />
        <p>This is the first paragraph under the picture.</p>
      </div>

      <!-- Slide 2: H1 + Paragraph -->
      <div class="slide">
        <h1>Title Section</h1>
        <p>This is the second section with a heading and a paragraph below.</p>
      </div>

      <!-- Slide 3: Two stacked pictures -->
      <div class="slide">
        <img src="images/picture2.jpg" alt="Picture 2" />
        <img src="images/picture3.jpg" alt="Picture 3" />
      </div>

    </div>
  </div>

</body>
</html>
